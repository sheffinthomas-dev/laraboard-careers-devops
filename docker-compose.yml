services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laraboard_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - public-data:/var/www/public
    networks:
      - laraboard
 
  webserver:
    image: nginx:alpine
    container_name: laraboard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - public-data:/var/www/public:ro
    depends_on:
      - app
    networks:
      - laraboard
 
  db:
    image: mysql:8.0
    container_name: laraboard_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laraboard
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laraboard
 
volumes:
  dbdata:
  public-data:
 
networks:
  laraboard:
    driver: bridge
