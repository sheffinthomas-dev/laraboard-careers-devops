services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laraboard_app
        restart: unless-stopped
        volumes:
            - public-data:/var/www/public
            - ./.env:/var/www/.env
        depends_on:
            db:
                condition: service_healthy
        networks:
            - laraboard

    webserver:
        image: nginx:alpine
        container_name: laraboard_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - public-data:/var/www/public:ro
        depends_on:
            - app
        networks:
            - laraboard

    db:
        image: mysql:8.0
        container_name: laraboard_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: laraboard
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-p${DB_PASSWORD}",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - laraboard

volumes:
    dbdata:
    public-data:

networks:
    laraboard:
        driver: bridge
