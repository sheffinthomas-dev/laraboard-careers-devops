services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laraboard_app
        restart: unless-stopped
        volumes:
            - public-data:/var/www/public
            - ./.env:/var/www/.env
        networks:
            - laraboard

    webserver:
        image: nginx:alpine
        container_name: laraboard_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - public-data:/var/www/public:ro
        depends_on:
            - app
        networks:
            - laraboard

    db:
        image: mysql:8.0
        container_name: laraboard_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: laraboard
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laraboard

    grafana:
        image: grafana/grafana:latest
        container_name: laraboard_grafana
        restart: unless-stopped
        ports:
            - "3000:3000"
        networks:
            - laraboard

    node-exporter:
        image: prom/node-exporter:latest
        container_name: laraboard_node_exporter
        restart: unless-stopped
        ports:
            - "9100:9100"
        networks:
            - laraboard

    prometheus:
        image: prom/prometheus:latest
        container_name: laraboard_prometheus
        restart: unless-stopped
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        networks:
            - laraboard

volumes:
    dbdata:
    public-data:

networks:
    laraboard:
        driver: bridge
